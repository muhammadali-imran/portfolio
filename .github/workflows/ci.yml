name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Deterministic verifiers
        run: npm run verify

      - name: Verifier tests
        run: npm run verify:test

      - name: Build
        run: npm run build
        env:
          VITE_SITE_URL: https://example.com

      - name: Verify build output
        run: npm run verify:dist

  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Conventional Commits
        run: |
          set -e
          for sha in $(git rev-list origin/${{ github.base_ref }}..HEAD --no-merges); do
            git log -1 --format=%B "$sha" > /tmp/msg
            node scripts/verify/commit-msg.mjs /tmp/msg || { echo "Bad commit $sha"; exit 1; }
          done
